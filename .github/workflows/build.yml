name: Build WA SmartBot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP project
        run: |
          rm -rf temp
          mkdir temp
          unzip -o WA-SmartBot-Complete-Android-v1.zip -d temp
          find temp -mindepth 1 -maxdepth 1 ! -name ".github" -exec mv {} . \;
          rm -rf temp

      - name: Fix Android notification listener XML
        run: |
          FILE="app/src/main/res/xml/notification_listener.xml"
          if [ -f "$FILE" ]; then
            sed -i 's/android:default_filter_types="[^"]*"//g' "$FILE"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          echo "Found APK: $APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartBot-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WA SmartBot Build ${{ github.run_number }}
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

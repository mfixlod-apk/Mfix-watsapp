name: Build Mfix WhatsApp Bot APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP project
        run: |
          rm -rf project temp
          mkdir temp
          unzip -q WA-SmartBot-Complete-Android-v1.zip -d temp
          shopt -s dotglob
          mv temp/* .
          rm -rf temp

      - name: Fix Android notification listener XML
        run: |
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/notification_listener.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <notification-listener xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: |
          chmod +x gradlew || true

      - name: Build APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find APK
        run: |
          find . -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mfix-WhatsApp-Bot-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error

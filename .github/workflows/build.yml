name: Build WA SmartBot APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP project
        run: |
          if [ -f "WA-SmartBot-Complete-Android-v1.zip" ]; then
            unzip -o "WA-SmartBot-Complete-Android-v1.zip" -d temp
            shopt -s dotglob
            mv temp/* .
            rm -rf temp
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-SmartBot-APK
          path: app/build/outputs/apk/debug/app-debug.apk

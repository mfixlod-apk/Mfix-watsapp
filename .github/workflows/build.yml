name: Build WA SmartBot APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP project
        id: zip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f \( -iname "*.zip" \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d project

          echo "Project files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: android
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find project -type f -name "settings.gradle" | head -n 1)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android settings.gradle file not found"
            find project -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        run: |
          APK_FILE=$(find "${{ steps.android.outputs.project_dir }}" -type f -name "*.apk" | grep -v "unsigned" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            find "${{ steps.android.outputs.project_dir }}" -type f
            exit 1
          fi

          echo "APK found: $APK_FILE"

          mkdir -p output
          cp "$APK_FILE" output/MFIX-WA-SmartBot.apk

          echo "apk_path=output/MFIX-WA-SmartBot.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-WA-SmartBot-APK
          path: output/MFIX-WA-SmartBot.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MFIX WA SmartBot Build ${{ github.run_number }}
          files: output/MFIX-WA-SmartBot.apk
          generate_release_notes: true
